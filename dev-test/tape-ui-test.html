<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tape UI test</title>
<link rel="stylesheet" href="../css/main.css">
<style>
  /* #welcome etc. are not on this page; only the tape UI is under test */
  #log { position: fixed; top: 30px; right: 6px; text-align: right; z-index: 20; max-width: 60vw; font-size: 14px; line-height: 1.15;
         color: #5a5a5a; pointer-events: none; white-space: pre-wrap; text-transform: none; }
  #state { position: fixed; top: 6px; right: 6px; z-index: 20; font-size: 16px; color: #00e5ff; text-align: right; }
</style>
</head>
<body class="play-grid">
<div id="state"></div>
<div id="log"></div>
<canvas id="tape-canvas" role="button" tabindex="0" aria-label="OPEN TAPE EDITOR"></canvas>
<div id="tape-editor" role="region" aria-label="TAPE EDITOR" hidden></div>
<script type="module">
import { Tape, makeStep } from '../js/grid/tape.js';
import { TapeView } from '../js/visuals/tape-view.js';
import { TapeEditor } from '../js/grid/editor.js';

const scale = { scaleId: 'minorPentatonic', rootIndex: 9, scaleLabel: 'MIN PENT', noteNames: ['A', 'C', 'D', 'E', 'G', 'A'] };
const tape = new Tape();
tape.ensureBar(23);
let seed = 7;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
let band = 2;
for (let b = 0; b < 24; b++) for (let i = 0; i < 16; i++) {
  if (rnd() < (i % 4 === 0 ? 0.5 : 0.2)) {
    band = Math.max(0, Math.min(5, band + Math.floor(rnd() * 3) - 1));
    tape.setStep(b, i, makeStep({ band, octave: rnd() < 0.1 ? 1 : 0, grainSize: 0.05 + rnd() * 0.3, density: 4 + rnd() * 50, filterCutoff: 800 + rnd() * 12000 }, scale));
  }
}

const logEl = document.getElementById('log');
const lines = [];
const log = (m) => { lines.push(m); if (lines.length > 8) lines.shift(); logEl.textContent = lines.join('\n'); };

const grid = {
  tape, mode: 'play', playhead: { bar: 12, step: 0 }, armed: null, bpm: 116,
  getScaleState: () => scale,
  enterEdit() { this.mode = 'edit'; log('enterEdit'); },
  exitEdit(bar) { this.mode = 'play'; this.playhead = { bar, step: 0 }; log(`exitEdit(${bar})`); },
  scrubTo(bar, step) { this.playhead = { bar, step }; log(`scrubTo(${bar}, ${step})`); },
  stutterStart(bar, step, rate) { log(`stutterStart(${bar}, ${step}, ${rate})`); },
  stutterStop() { log('stutterStop'); },
  onModeChange() { return () => {}; },
};

const tapeView = new TapeView(document.getElementById('tape-canvas'), { onTap: () => toEdit() });
const editor = new TapeEditor(document.getElementById('tape-editor'), { grid });
editor.onPlayFromHere = (bar) => { editor.close(); grid.exitEdit(bar); };
window.__t = { grid, tape, editor, tapeView };

function toEdit() { if (grid.mode === 'edit') return; grid.enterEdit(); editor.open(); }
function toPlay() { editor.close(); grid.exitEdit(editor.cursorBar); }

// fake transport: 16th steps at the grid bpm; W toggles write, E erase
let acc = 0, last = performance.now();
function tick(now) {
  const dt = now - last; last = now;
  if (grid.mode === 'play') {
    acc += dt;
    const stepMs = 60000 / grid.bpm / 4;
    while (acc >= stepMs) {
      acc -= stepMs;
      let { bar, step } = grid.playhead;
      step++; if (step >= 16) { step = 0; bar = (bar + 1) % tape.barCount; }
      grid.playhead = { bar, step };
      if (grid.armed === 'write') tape.setStep(bar, step, makeStep({ band: Math.floor(rnd() * 6), octave: 0, grainSize: 0.09, density: 12, filterCutoff: 12000 }, scale));
      if (grid.armed === 'erase') tape.setStep(bar, step, null);
    }
  }
  tapeView.draw({ tape, playhead: grid.playhead, armed: grid.armed, bpm: grid.bpm, mode: grid.mode }, now);
  document.getElementById('state').textContent = `${grid.mode.toUpperCase()} · W = WRITE · E = ERASE · N = NONE`;
  requestAnimationFrame(tick);
}
addEventListener('keydown', (e) => {
  if (e.code === 'Space') { e.preventDefault(); if (!e.repeat) (grid.mode === 'play' ? toEdit : toPlay)(); }
  else if (grid.mode === 'play') {
    if (e.key === 'w') grid.armed = grid.armed === 'write' ? null : 'write';
    else if (e.key === 'e') grid.armed = grid.armed === 'erase' ? null : 'erase';
    else if (e.key === 'n') grid.armed = null;
  }
});
(document.fonts && document.fonts.load ? document.fonts.load('20px VT323') : Promise.resolve()).finally(() => requestAnimationFrame(tick));
</script>
</body>
</html>
