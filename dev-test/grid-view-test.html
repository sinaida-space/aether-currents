<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grid view test</title>
<style>
  body { margin: 0; background: #000; color: #f2f2f2; font: 14px monospace; }
  #ui-bar { position: fixed; left: 0; right: 0; bottom: 0; height: 58px; background: #111; }
  canvas { position: fixed; left: 0; width: 100%; }
  #panel { padding: 16px; }
  button { font: inherit; }
</style>
</head>
<body>
<div id="panel">
  <p>Keys: W = write, E = erase, N = none.</p>
  <button id="dl">Download gridToMidi (116 bpm)</button>
  <p id="result">...</p>
</div>
<div id="ui-bar" class="visible"></div>
<canvas id="c"></canvas>
<script type="module">
import { BeatTimeline } from '../js/visuals/beat-timeline.js';
import { gridToMidi } from '../js/midi/grid-export.js';

const steps = Array(16).fill(null);
[0, 2, 4, 5, 8, 10, 12, 14].forEach((i, k) => {
  const semis = -12 + k * 5;
  steps[i] = {
    semitones: semis, pc: ((semis % 12) + 12 + 9) % 12, pitch: 2 ** (semis / 12),
    grainSize: 0.03 + k * 0.06, density: 4 + k * 9, filterCutoff: 300 * (1 + k * 3),
  };
});

const tl = new BeatTimeline(document.getElementById('c'));
let armed = 'write';
addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  if (k === 'w') armed = 'write'; else if (k === 'e') armed = 'erase'; else if (k === 'n') armed = null;
});
addEventListener('resize', () => tl.resize());
function frame(now) {
  const cur = Math.floor(now / 129) % 16;
  tl.draw({
    visible: true, bpm: 116, phase: 0, beatIndex: 0, lanes: [],
    grid: { steps, currentStep: cur, armed },
  }, now);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

const bytes = gridToMidi(steps, { bpm: 116 });
const str = (o, n) => String.fromCharCode(...bytes.slice(o, o + n));
const fmt = (bytes[8] << 8) | bytes[9];
const mtrk = str(14, 4) === 'MTrk' && str(14, 4 + 1000).split('MTrk').length === 2;
const ok = str(0, 4) === 'MThd' && fmt === 0 && mtrk;
document.getElementById('result').textContent = `${ok ? 'PASS' : 'FAIL'} header=${str(0, 4)} format=${fmt} MTrk=${mtrk} bytes=${bytes.length}`;
document.getElementById('dl').onclick = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([bytes], { type: 'audio/midi' }));
  a.download = 'grid-test.mid';
  a.click();
};
</script>
</body>
</html>
