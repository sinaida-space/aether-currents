<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>tape-export test</title>
<style>body{background:#0a0a0a;color:#eee;font:14px monospace;padding:16px}button{font:inherit;background:#000;color:#eee;border:1px solid #e0262a;padding:8px 14px;margin-right:8px;cursor:pointer}pre{white-space:pre-wrap}</style>
</head><body>
<button id="exp">▸ EXPORT</button><button id="lis">▸ LISTEN</button>
<pre id="out">ready</pre>
<script type="module">
import { tapeToMidi, saveMidi } from '../js/midi/tape-export.js';
const out = document.getElementById('out');
const log = (s) => { out.textContent += '\n' + s; };
window.__scheduled = null; window.__fileNotes = null;

const bars = Array.from({ length: 8 }, (_, b) => Array.from({ length: 16 }, (_, i) =>
  (i % 2 === 0 || b % 3 === 0) ? { band: i % 6, octave: 0, semitones: [0, 2, 4, 7, 9, 12][i % 6], pc: 0, pitch: 1, grainSize: 0.05 + 0.03 * (i % 5), density: 10 + 5 * i, filterCutoff: 500 * (1 + i) } : null));
const tape = { bars, barCount: 8, loop: null, getStep: (b, i) => bars[b][i] };
const BPM = 116;
const bytes = () => tapeToMidi(tape, { bpm: BPM, range: null, scaleLabel: 'Test scale' });

// tiny inline parser: returns { ppq, tempo, notes:[{tick,ch,note}] }
function parse(buf) {
  const s = (o, n) => String.fromCharCode(...buf.subarray(o, o + n));
  const dv = new DataView(buf.buffer, buf.byteOffset, buf.byteLength);
  const ntrks = dv.getUint16(10), ppq = dv.getUint16(12);
  let p = 14, tempo = 500000; const notes = [];
  for (let t = 0; t < ntrks; t++) {
    const len = dv.getUint32(p + 4); let q = p + 8; const e = q + len; let tick = 0, run = 0;
    const v = () => { let x = 0, b; do { b = buf[q++]; x = (x << 7) | (b & 127); } while (b & 128); return x; };
    while (q < e) {
      tick += v(); let st = buf[q];
      if (st & 128) { q++; if (st < 240) run = st; } else st = run;
      if (st === 255) { const ty = buf[q++], l = v(); if (ty === 0x51) tempo = (buf[q] << 16) | (buf[q + 1] << 8) | buf[q + 2]; q += l; }
      else { const hi = st & 240; if (hi === 0x90 && buf[q + 1] > 0) notes.push({ tick, ch: (st & 15) + 1, note: buf[q] }); q += (hi === 0xc0 || hi === 0xd0) ? 1 : 2; }
    }
    p = e;
  }
  return { ppq, tempo, notes };
}

document.getElementById('exp').onclick = async () => {
  try { log('save: ' + JSON.stringify(await saveMidi(bytes(), 'tape-test.mid'))); }
  catch (e) { log('export error ' + e); }
};

document.getElementById('lis').onclick = () => {
  try {
    const m = parse(bytes());
    const secPerTick = m.tempo / 1e6 / m.ppq;
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const t0 = ctx.currentTime + 0.1;
    const nb = ctx.createBuffer(1, ctx.sampleRate * 0.05, ctx.sampleRate);
    const d = nb.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
    let n = 0;
    for (const ev of m.notes) {
      const t = t0 + ev.tick * secPerTick; const g = ctx.createGain(); g.connect(ctx.destination);
      if (ev.ch === 3) {
        const o = ctx.createOscillator(); o.type = 'triangle'; o.frequency.value = 440 * 2 ** ((ev.note - 69) / 12);
        g.gain.setValueAtTime(0.2, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.12); o.connect(g); o.start(t); o.stop(t + 0.14);
      } else if (ev.note === 36) {
        const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(40, t + 0.15);
        g.gain.setValueAtTime(0.5, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.18); o.connect(g); o.start(t); o.stop(t + 0.2);
      } else {
        const s = ctx.createBufferSource(); s.buffer = nb; g.gain.setValueAtTime(0.15, t); s.connect(g); s.start(t);
      }
      n++;
    }
    window.__scheduled = n; window.__fileNotes = m.notes.length;
    log(`scheduled ${n} of ${m.notes.length} file notes at ${(60e6 / m.tempo).toFixed(1)} BPM`);
  } catch (e) { log('listen error ' + e); }
};
</script>
</body></html>
